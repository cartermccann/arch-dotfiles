# tmux config, ported from Carter's NixOS setup. Prefix is Ctrl+A.

set  -g default-terminal "tmux-256color"
set  -g base-index      1
setw -g pane-base-index 1

set -g status-keys vi
set -g mode-keys   vi

# rebind main key: C-a
unbind C-b
set -g prefix C-a
bind -N "Send the prefix key through to the application" \
  C-a send-prefix

set  -g mouse             on
set  -g focus-events      off
setw -g aggressive-resize off
setw -g clock-mode-style  12
set  -s escape-time       0
set  -g history-limit     50000

# The useful parts of tmux-sensible, inlined (no plugin manager needed)
set -g display-time 4000
set -g status-interval 5
bind C-p previous-window
bind C-n next-window
bind R source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Base16 Ouranos
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#e7ebf2,bg=#0a0c11"

# default window title colors
set-window-option -g window-status-style "fg=#e7ebf2,bg=#0a0c11"

# active window title colors
set-window-option -g window-status-current-style "fg=#fbbf24,bg=#0a0c11"

# pane border
set-option -g pane-border-style "fg=#0f1218"
set-option -g pane-active-border-style "fg=#8b93a4"

# message text
set-option -g message-style "fg=#c7cdd8,bg=#0f1218"

# pane number display
set-option -g display-panes-active-colour "#8b93a4"
set-option -g display-panes-colour "#0f1218"

# clock
set-window-option -g clock-mode-colour "#3b6bff"

# copy mode highlight
set-window-option -g mode-style "fg=#8b93a4,bg=#0f1218"

# bell
set-window-option -g window-status-bell-style "fg=#0a0c11,bg=#f87171"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#e7ebf2,bg=#0a0c11"

# style for command messages
set-option -g message-command-style "fg=#c7cdd8,bg=#0f1218"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#e7ebf2,bg=#0a0c11"
  set-window-option -g window-style "fg=#e7ebf2,bg=#0a0c11"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#e7ebf2,bg=#171b23] #S #[fg=#171b23,bg=#0a0c11,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#0f1218,bg=#0a0c11 nobold, nounderscore, noitalics]#[fg=#8b93a4,bg=#0f1218] %Y-%m-%d  %H:%M #[fg=#e7ebf2,bg=#0f1218,nobold,noitalics,nounderscore]#[fg=#0a0c11,bg=#e7ebf2] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#0a0c11,bg=#fbbf24,nobold,noitalics,nounderscore]#[fg=#0f1218,bg=#fbbf24] #I #[fg=#0f1218,bg=#fbbf24,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#fbbf24,bg=#0a0c11,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#0a0c11,bg=#0f1218,noitalics]#[fg=#c7cdd8,bg=#0f1218] #I #[fg=#c7cdd8,bg=#0f1218] #W#{?window_zoomed_flag,*Z,} #[fg=#0f1218,bg=#0a0c11,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:

# Split panes with | and -
bind -N "Split right" | split-window -h -c "#{pane_current_path}"
bind -N "Split down" - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind -N "New window" c new-window -c "#{pane_current_path}"

# Vim pane navigation
bind -N "Focus pane left" h select-pane -L
bind -N "Focus pane down" j select-pane -D
bind -N "Focus pane up" k select-pane -U
bind -N "Focus pane right" l select-pane -R

# Vim pane resize
bind -r -N "Resize pane left" H resize-pane -L 5
bind -r -N "Resize pane down" J resize-pane -D 5
bind -r -N "Resize pane up" K resize-pane -U 5
bind -r -N "Resize pane right" L resize-pane -R 5

# Copy mode with wl-copy (Wayland clipboard)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# Status bar at top
set -g status-position top

# True color support
set -ag terminal-overrides ",xterm-256color:RGB"

# csi-u extended keys: Shift/Ctrl-modified keys reach TUI agents
# (Claude Code under ghostty needs this for e.g. shift+enter)
set -g extended-keys on
set -s extended-keys-format csi-u
set -g allow-passthrough on
set -g focus-events on
set -g renumber-windows on
set -g detach-on-destroy off    # killing a session falls into the next one

# Window auto-rename from cwd basename
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Prefix-free nav (Alt layer; existing C-a prefix binds untouched)
bind -n -N "Split down" M-Enter   split-window -v -c "#{pane_current_path}"
bind -n -N "Split right" M-S-Enter split-window -h -c "#{pane_current_path}"
bind -n -N "Select window 1" M-1 select-window -t 1
bind -n -N "Select window 2" M-2 select-window -t 2
bind -n -N "Select window 3" M-3 select-window -t 3
bind -n -N "Select window 4" M-4 select-window -t 4
bind -n -N "Select window 5" M-5 select-window -t 5
bind -n -N "Select window 6" M-6 select-window -t 6
bind -n -N "Select window 7" M-7 select-window -t 7
bind -n -N "Select window 8" M-8 select-window -t 8
bind -n -N "Select window 9" M-9 select-window -t 9
bind -n -N "Previous window" M-Left  previous-window
bind -n -N "Next window" M-Right next-window
bind -n -N "Previous session" M-Up   switch-client -p
bind -n -N "Next session" M-Down switch-client -n

# Mode indicators on status-right (COPY / prefix / ZOOM). Colors use
# terminal palette names, so they ride the ghostty palette for free.
set -g status-right '#{?pane_in_mode,#[fg=yellow]COPY ,}#{?client_prefix,#[fg=blue]⌘ ,}#{?window_zoomed_flag,#[fg=magenta]ZOOM ,}'
