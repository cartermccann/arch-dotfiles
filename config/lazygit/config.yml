gui:
  nerdFontsVersion: "3"
  border: rounded
  showFileTree: true
  showListFooter: false
  showRandomTip: false
  showBottomLine: false
  theme:
    activeBorderColor:
      - "#b4befe" # lavender
      - bold
    inactiveBorderColor:
      - "#a6adc8" # subtext0
    optionsTextColor:
      - "#89b4fa" # blue
    selectedLineBgColor:
      - "#313244" # surface0
    cherryPickedCommitFgColor:
      - "#89b4fa" # blue
    cherryPickedCommitBgColor:
      - "#313244" # surface0
    markedBaseCommitFgColor:
      - "#a6e3a1" # green
    markedBaseCommitBgColor:
      - "#313244" # surface0
    unstagedChangesColor:
      - "#f38ba8" # red
    defaultFgColor:
      - "#cdd6f4" # text
    searchingActiveBorderColor:
      - "#f9e2af" # yellow
os:
  editPreset: "nvim-remote"
git:
  pagers:
    - pager: "delta --dark --paging=never"
