background {
  monitor =
  path = ~/wallpaper.png
  blur_passes = 5
  blur_size = 12
  noise = 0.035
  contrast = 0.9
  brightness = 0.7
  vibrancy = 0.25
}

input-field {
  monitor =
  size = 280, 50
  outline_thickness = 2
  dots_size = 0.25
  dots_spacing = 0.3
  outer_color = rgba(3b6bffee)
  inner_color = rgba(0f1218cc)
  font_color = rgba(e7ebf2ff)
  check_color = rgba(22d3eeee)
  fail_color = rgba(f87171ee)
  placeholder_text = <span foreground="##8b93a4">password</span>
  rounding = 14
  fade_on_empty = false
  position = 0, -40
  halign = center
  valign = center
}

label {
  monitor =
  text = $TIME
  font_size = 64
  font_family = JetBrainsMono Nerd Font
  color = rgba(e7ebf2ff)
  position = 0, 120
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:60000] date +"%A, %B %d"
  font_size = 18
  font_family = JetBrainsMono Nerd Font
  color = rgba(c7cdd8cc)
  position = 0, 60
  halign = center
  valign = center
}
