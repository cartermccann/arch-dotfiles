[main]
font=JetBrainsMono Nerd Font:size=12
prompt=>
icon-theme=Papirus-Dark
lines=10
width=36
horizontal-pad=20
vertical-pad=16
inner-pad=10
layer=overlay

# Lens tier (lib/ouranos.nix): Hyprland's layer blur behind a 50% tint,
# a neutral hairline rather than a cobalt frame, and cobalt only on the
# selected row. fuzzel draws no inner shadows, so the edge light that
# waybar/swaync get is carried here by the hairline alone.
[colors]
background=0f121880
text=e7ebf2ff
prompt=8b93a4ff
placeholder=3a4152ff
input=e7ebf2ff
match=3b6bffff
selection=3b6bff33
selection-text=f4f7fcff
selection-match=22d3eeff
border=e7ebf224

[border]
width=1
radius=14
selection-radius=10
